name: Build cattle export dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/data-pipeline.yml"
  schedule:
    - cron: "20 10 8 * *"

permissions:
  contents: write

concurrency:
  group: cattle-export-data-main
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run official-data pipeline
        run: python src/run_pipeline.py

      - name: Validate generated datasets
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          base = Path('data/processed')
          required = [
              'fato_exportacao_bovinos.csv',
              'fato_rebanho_bovino.csv',
              'resumo_regional_anual.csv',
              'resumo_destinos_anual.csv',
          ]
          for name in required:
              path = base / name
              assert path.exists(), f'Arquivo ausente: {path}'
              df = pd.read_csv(path)
              assert not df.empty, f'Arquivo vazio: {path}'
              print(f'{name}: {len(df):,} linhas')

          exports = pd.read_csv(base / 'fato_exportacao_bovinos.csv')
          assert exports['ano'].min() <= 2020
          assert exports['ano'].max() >= 2025
          assert exports['valor_fob_usd'].sum() > 0
          assert exports['cabecas_exportadas'].sum() > 0
          assert 'data' in exports.columns
          print('Validação básica concluída.')
          PY

      - name: Build dynamic dashboard dataset
        run: python src/build_dashboard_data.py

      - name: Validate dashboard JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('dashboard/data.json')
          assert path.exists(), 'dashboard/data.json não foi gerado'
          data = json.loads(path.read_text(encoding='utf-8'))
          for key in ['meta', 'y', 'd', 'u', 'r', 'm', 'h']:
              assert key in data, f'Chave ausente: {key}'
          assert data['y'], 'Série anual vazia'
          assert data['meta']['closed_year'] >= 2025
          print('Dashboard JSON validado:', data['meta'])
          PY

      - name: Upload Power BI-ready datasets
        uses: actions/upload-artifact@v4
        with:
          name: cattle-export-powerbi-data
          path: |
            data/processed/*.csv
            dashboard/data.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest dashboard data to repository
        run: |
          if git diff --quiet -- dashboard/data.json; then
            echo "dashboard/data.json já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data.json
          git commit -m "data: refresh cattle export dashboard [skip ci]"
          git push origin HEAD:main
